name: CI (eigener Rechner)

# Dieselben Prüfungen wie in ci.yml, aber auf einem selbst gehosteten Windows-Runner (dem eigenen Rechner).
# Kostet keine Actions-Minuten. Läuft nur, solange dort der Runner gestartet ist (run.cmd); sonst wartet der Lauf.
# Nur für das private Repository gedacht: Vor einer Veröffentlichung den Runner entfernen oder diese Datei löschen.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (eigener Windows-Rechner)
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        # Windows PowerShell 5.1 ist überall vorhanden; jeder Befehl wird einzeln auf seinen Rückgabewert geprüft,
        # weil PowerShell sonst nach einem Fehler weiterläuft.
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          # Nicht jedes Mal alles löschen: Der Rust-Build (target/) bleibt so erhalten und der Lauf ist viel schneller.
          clean: false

      - name: Python-Umgebung für den Lauf
        run: |
          python --version
          python -m venv .venv-ci; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv-ci\Scripts\python -m pip install -e "core[dev]"; if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Analysekern testen
        working-directory: core
        run: |
          ..\.venv-ci\Scripts\python -m ruff check .; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ..\.venv-ci\Scripts\python -m pytest -q; if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Oberfläche bauen und testen
        working-directory: app
        run: |
          npm ci; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test; if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Desktop-Hülle testen
        working-directory: app/src-tauri
        run: |
          $env:JURACORE_PYTHON = (Resolve-Path ..\..\.venv-ci\Scripts\python.exe).Path
          cargo test; if ($LASTEXITCODE) { exit $LASTEXITCODE }
