name: CI

# Läuft auf den Runnern von GitHub (Linux, Windows, macOS). Von Hand startbar über Actions → CI → Run workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Die Prüfungen lesen nur den Quelltext; mehr Rechte bekommt das Zugriffstoken nicht.
permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten für Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          # Texterkennung für den OCR-Test (auf Windows und macOS wird er übersprungen)
          sudo apt-get install -y tesseract-ocr tesseract-ocr-deu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analysekern testen
        working-directory: core
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          pytest -q

      - name: Hilfsprogramm für Apple Intelligence übersetzen
        if: runner.os == 'macOS'
        run: |
          # Foundation Models gibt es erst im SDK von macOS 26; mit einem älteren Xcode wird nur ein Hinweis ausgegeben.
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          if [ "${sdk%%.*}" -ge 26 ]; then
            echo "macOS-SDK $sdk: prüfe das Apple-Hilfsprogramm"
            xcrun swiftc -typecheck macos/apple-ki/main.swift
          else
            echo "::notice::macOS-SDK $sdk ohne Foundation Models: Apple-Hilfsprogramm nicht geprüft"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Oberfläche bauen und testen
        working-directory: app
        run: |
          npm ci
          npm run build
          npm test

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Desktop-Hülle testen
        working-directory: app/src-tauri
        env:
          JURACORE_PYTHON: python
        run: cargo test
