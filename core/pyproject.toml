[project]
name = "juracore"
version = "0.1.0"
description = "Analysekern von JuraBox"
requires-python = ">=3.11"
license = {text = "EUPL-1.2"}
classifiers = ["License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)"]
# pypdfium2: PDF-Text und Seitenbilder für die Texterkennung; fertige Pakete für Windows, macOS und Linux.
# keyring: API-Schlüssel im Schlüsselbund des Systems (Windows, macOS, Linux Secret Service).
dependencies = ["pypdfium2>=4.30,<6", "truststore>=0.9", "keyring>=24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Bündeln des Kerns für den Installer (core/kern_bauen.py)
paket = ["pyinstaller>=6"]

[project.scripts]
juracore = "juracore.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["juracore*"]

[tool.setuptools.package-data]
juracore = ["gesetze/*.json", "ausgabe/schriften/*.ttf", "ausgabe/schriften/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
