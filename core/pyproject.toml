[project]
name = "juracore"
version = "0.1.0"
description = "Analysekern des Juristischen Datenabgleichs"
requires-python = ">=3.11"
# pypdfium2: PDF-Text und Seitenbilder für die Texterkennung; fertige Pakete für Windows, macOS und Linux.
dependencies = ["pypdfium2>=4.30,<6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
juracore = "juracore.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["juracore*"]

[tool.setuptools.package-data]
juracore = ["gesetze/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
