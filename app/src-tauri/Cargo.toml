[package]
name = "juristischer-datenabgleich"
version = "0.1.0"
description = "Desktop-App für Analyse, Vergleich und Zusammenfassung juristischer Dokumente"
edition = "2021"
license = "EUPL-1.2"
rust-version = "1.77"
# Programmdatei heißt „jurabox“: macOS zeigt im Entwicklungsmodus (Dock, Mouseover) den Dateinamen an.
# Der Paketname bleibt bewusst „juristischer-datenabgleich“ (siehe README).
default-run = "jurabox"

[lib]
name = "jda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "jurabox"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
